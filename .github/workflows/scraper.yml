name: Scrape Jobs

on:
  schedule:
    # Run every day at 9:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:        # Allows manual trigger

permissions:
  contents: write          # Needed to commit the updated CSV

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Get full history for commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scraper
        run: python job_scraper.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output_old.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update job archive [skip ci]" && git push)

      - name: Install requests for Telegram
        run: pip install requests

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
import sys, json, os, requests

data = sys.stdin.read()
start = data.find('NEW_JOBS_START')
end = data.find('NEW_JOBS_END')
if start != -1 and end != -1:
    json_str = data[start+len('NEW_JOBS_START'):end].strip()
    if json_str:
        new_jobs = json.loads(json_str)
        if new_jobs:
            token = os.environ['TELEGRAM_BOT_TOKEN']
            chat_id = os.environ['TELEGRAM_CHAT_ID']
            message = '📢 New jobs found:\n\n'
            for job in new_jobs:
                message += f\"*{job['company']}*: {job['title']}\n\"
                message += f\"  {job['location']}\n\"
                message += f\"  [Link]({job['link']})\n\n\"
            # Telegram API
            url = f\"https://api.telegram.org/bot{token}/sendMessage\"
            params = {'chat_id': chat_id, 'text': message, 'parse_mode': 'Markdown'}
            response = requests.post(url, data=params)
            response.raise_for_status()
            print('Telegram message sent.')
        else:
            print('No new jobs.')
    else:
        print('No new jobs.')
else:
    print('No new jobs output found.')
"