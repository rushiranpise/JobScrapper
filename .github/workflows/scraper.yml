name: Scrape Jobs

on:
  push:
  schedule:
    # Run every day at 9:00 UTC (adjust to your preference)
    - cron: '0 9 * * *'
  workflow_dispatch:    # Allows manual trigger from the GitHub UI

permissions:
  contents: write       # Required to commit the updated CSV

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Get all history, so we can commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scraper
        run: python job_scraper.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output_old.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update job archive [skip ci]" && git push)