name: Test Scrape Jobs

on:
  push:
  workflow_dispatch:

concurrency:
  group: test-scrape-jobs
  cancel-in-progress: false   # Queue new runs until the current one completes

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scraper
        id: scraper
        run: cd test && python testjob_scraper.py 2>&1 | tee scraper_output.txt

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd test && git add *
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update job archive and daily markdown [skip ci]" && git push)

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN2: ${{ secrets.TELEGRAM_BOT_TOKEN2 }}
          TELEGRAM_BOT_TOKEN3: ${{ secrets.TELEGRAM_BOT_TOKEN3 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
          TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
        run: |
          python send_telegram.py < scraper_output.txt